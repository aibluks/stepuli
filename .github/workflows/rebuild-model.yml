name: Rebuild identical experimental model and mirror parts
# No training or inference. Every download and generated byte is checksum gated.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stepuli-experimental-model-mirror
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.repository == 'aibluks/stepuli' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Rebuild exact frozen model using public pinned inputs
        run: python3 scripts/cloud_rebuild_model.py --output-dir cloud-rebuilt
      - name: Recheck full model and split the frozen transport layout
        run: |
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0, 'scripts')
          import mirror_model
          mirror_model.prepare_local('cloud-rebuilt/stepuli-v8-experimental-Q4_K_M.gguf')
          PYCODE
      - name: Upload only the 16 independently verified transport parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror_model.py upload
